<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PPL Minimal Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 12px; padding-bottom: 95px; }

    /* Barra superior del cronómetro: Azul por defecto, Rojo en tiempo negativo */
    #timer-banner {
      display: none;
      position: sticky;
      top: 0;
      z-index: 200;
      background: #0284c7;
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.55);
      flex-direction: column;
      gap: 8px;
      transition: background-color 0.3s ease;
    }
    #timer-banner.overtime {
      background: #dc2626 !important;
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.5);
    }

    .timer-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    #timer-display { 
      font-size: 3.6rem; 
      font-weight: 900; 
      font-variant-numeric: tabular-nums; 
      letter-spacing: 0.02em;
      line-height: 0.95;
    }

    /* Botones rápidos de descanso */
    .timer-presets {
      display: flex;
      gap: 5px;
      width: 100%;
    }
    .preset-btn {
      flex: 1;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      padding: 7px 0;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }
    .preset-btn:active { background: rgba(255,255,255,0.4); }

    .timer-controls { display: flex; gap: 6px; align-items: center; }
    .timer-btn {
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.5);
      color: #fff;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }
    .timer-btn:active { background: rgba(255,255,255,0.45); }

    /* Menú Desplegable de Rutinas */
    .nav-select-wrapper { margin-bottom: 10px; }
    .nav-select {
      width: 100%;
      padding: 12px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      text-align-last: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .nav-select:focus { border-color: #38bdf8; outline: none; }

    /* Panel de Historial de Sesión Anterior */
    .history-card {
      background: #111e38;
      border: 1px solid #1e3a8a;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.82rem;
    }
    .history-card summary {
      color: #60a5fa;
      font-weight: 700;
      cursor: pointer;
      list-style: none;
      outline: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-card summary::-webkit-details-marker { display: none; }
    .history-card summary:before { content: "📋 Ver Historial Sesión Anterior ▾"; }
    .history-card[open] summary:before { content: "📋 Ocultar Historial ▴"; }
    .history-body {
      margin-top: 8px;
      color: #cbd5e1;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.78rem;
      background: #0b1329;
      padding: 8px;
      border-radius: 6px;
      max-height: 200px;
      overflow-y: auto;
    }

    /* Tarjetas colapsables de ejercicios */
    details.exercise-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    details.exercise-card summary {
      padding: 14px 12px;
      cursor: pointer;
      list-style: none;
      outline: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    details.exercise-card summary::-webkit-details-marker { display: none; }
    
    .exercise-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .exercise-arrow {
      color: #38bdf8;
      font-size: 0.8rem;
      transition: transform 0.2s ease;
    }
    details.exercise-card[open] .exercise-arrow {
      transform: rotate(90deg);
    }
    .exercise-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: #f1f5f9;
    }
    .exercise-reps-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: #38bdf8;
      background: #0b2540;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #1e3a5f;
    }
    .rest-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      background: #0f172a;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .exercise-body {
      padding: 0 12px 12px 12px;
      border-top: 1px solid #283548;
      padding-top: 10px;
    }

    /* Selector de Ejercicio Sustituto/Variante */
    .variant-selector-wrap {
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .variant-selector-wrap span {
      font-size: 0.75rem;
      color: #f59e0b;
      font-weight: 800;
      white-space: nowrap;
    }
    .variant-select {
      width: 100%;
      background: transparent;
      color: #38bdf8;
      border: none;
      font-size: 0.82rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }
    .variant-select option {
      background: #1e293b;
      color: #fff;
    }

    /* Línea de referencia del entreno anterior en cada tarjeta */
    .prev-performance-banner {
      font-size: 0.75rem;
      color: #93c5fd;
      background: rgba(30, 58, 138, 0.35);
      border-left: 3px solid #3b82f6;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    /* Calentamiento colapsable */
    details.warmup-details { 
      margin-bottom: 10px; 
      font-size: 0.78rem; 
      background: #0b132b; 
      border-radius: 8px; 
      padding: 8px 10px; 
      border: 1px solid #1e3a5f; 
    }
    details.warmup-details summary { cursor: pointer; color: #f59e0b; font-weight: 700; list-style: none; outline: none; }
    details.warmup-details summary::-webkit-details-marker { display: none; }
    details.warmup-details summary:before { content: "▸ "; color: #f59e0b; }
    details.warmup-details[open] summary:before { content: "▾ "; }
    .warmup-content { margin-top: 8px; color: #cbd5e1; line-height: 1.5; }
    .warmup-step { margin-bottom: 4px; display: block; }
    .warmup-step b { color: #38bdf8; }
    .warmup-target { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #334155; color: #a5f3fc; }

    /* Filas de series ampliadas (+25% de altura en casillas) */
    .set-header { display: grid; grid-template-columns: 36px 1fr 1fr 1fr 44px; gap: 6px; margin-bottom: 6px; }
    .set-header span { font-size: 0.72rem; color: #64748b; font-weight: 700; text-align: center; }
    .set-row { display: grid; grid-template-columns: 36px 1fr 1fr 1fr 44px; gap: 6px; align-items: center; margin-bottom: 9px; }
    .set-label { font-size: 0.8rem; color: #94a3b8; font-weight: 700; text-align: center; }

    /* Casillas táctiles aumentadas */
    input { 
      background: #0f172a; 
      border: 1px solid #334155; 
      border-radius: 8px; 
      color: #fff; 
      height: 48px; 
      padding: 0 4px; 
      text-align: center; 
      font-size: 1.12rem; 
      font-weight: 600; 
      width: 100%; 
      -moz-appearance: textfield; 
    }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input:focus { border-color: #38bdf8; outline: none; }

    .btn-timer-trigger { 
      background: #334155; 
      border: 1px solid #475569; 
      color: #e2e8f0; 
      border-radius: 8px; 
      height: 48px; 
      font-size: 1.15rem; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .btn-timer-trigger:active { background: #0284c7; }

    /* Barra inferior fija */
    .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid #334155; padding: 10px 14px; display: flex; gap: 8px; z-index: 100; }
    .btn-action { border: none; border-radius: 8px; font-weight: 700; font-size: 0.85rem; padding: 11px; cursor: pointer; }
    .btn-cfg { flex: 1; background: #334155; color: #f8fafc; }
    .btn-reload { flex: 0.6; background: #1e293b; color: #38bdf8; border: 1px solid #334155; font-size: 1.1rem; }
    .btn-copy { flex: 1.2; background: #475569; color: #f8fafc; }
    .btn-send { flex: 2; background: #10b981; color: #042f2e; }

    #response-box { display: none; border-radius: 10px; padding: 14px; margin-top: 16px; font-size: 0.88rem; line-height: 1.5; white-space: pre-wrap; }
    .loading { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>

  <!-- Cronómetro Flotante -->
  <div id="timer-banner">
    <div class="timer-top-row">
      <span id="timer-display">00:00</span>
      <div class="timer-controls">
        <button class="timer-btn" onclick="addTimerTime(30)">+30s</button>
        <button class="timer-btn" onclick="stopTimer()">✕</button>
      </div>
    </div>
    <div class="timer-presets">
      <button class="preset-btn" onclick="setTimerDirect(45)">45s</button>
      <button class="preset-btn" onclick="setTimerDirect(60)">60s</button>
      <button class="preset-btn" onclick="setTimerDirect(90)">90s</button>
      <button class="preset-btn" onclick="setTimerDirect(120)">2m</button>
      <button class="preset-btn" onclick="setTimerDirect(180)">3m</button>
    </div>
  </div>

  <!-- Selector Desplegable de Rutinas -->
  <div class="nav-select-wrapper">
    <select class="nav-select" id="routine-selector" onchange="loadRoutine(this.value)">
      <option value="push">Día 1: Push (Empuje)</option>
      <option value="pull">Día 2: Pull (Tirón)</option>
      <option value="legs">Día 3: Legs (Pierna)</option>
      <option value="repaso">Día 4: Repaso (Pecho / Espalda)</option>
      <option value="dia5">Día 5: Hombro y Brazo</option>
    </select>
  </div>

  <!-- Bloque de Historial General de la Sesión Previa -->
  <details class="history-card" id="history-panel">
    <summary></summary>
    <div class="history-body" id="history-content">No hay registros de sesiones anteriores para esta rutina.</div>
  </details>

  <!-- Lista de Ejercicios -->
  <div id="exercise-list"></div>

  <div id="response-box"></div>

  <div class="footer-bar">
    <button class="btn-action btn-reload" onclick="forzarActualizacion()" title="Actualizar app">🔄</button>
    <button class="btn-action btn-cfg" onclick="configureApiKey()">API Key</button>
    <button class="btn-action" style="flex:1; background:#f59e0b; color:#042f2e;" onclick="restaurarPull()">Restaurar Pull</button>
    <button class="btn-action btn-copy" onclick="copyWorkoutToClipboard()">Copiar</button>
    <button class="btn-action btn-send" id="btn-submit" onclick="submitWorkout()">Enviar Gemini</button>
  </div>

  <script>
    const SYSTEM_INSTRUCTION = `Eres el entrenador personal del usuario, experto en hipertrofia basada en evidencia, sobrecarga progresiva y salud articular.
Pautas ortopédicas permanentes:
- Codo izquierdo: Cuidar inserción del tendón del tríceps. Katana extensions en vez de presses franceses.
- Zona lumbar: Cero compresión axial innecesaria. Pies 15-20 cm adelantados y agarre thumbless en sentadilla guiada; peso muerto rumano en guiada con straps.
- Gemelos (Sóleo): 2 series pesadas en estiramiento (parada 2 s abajo) + 2 series en rango completo.
Evalúa sobrecarga progresiva estricta respecto a la sesión previa.`;

    /* BASE DE DATOS MODULAR POR SLOTS Y VARIANTES INMUTABLES */
    const routineSlots = {
      push: [
        {
          slotId: "push_slot_chest",
          slotName: "Pectoral Pesado",
          defaultVariant: "bench_smith",
          variants: [
            {
              id: "bench_smith",
              name: "Press banca en guiada",
              targetReps: "8-10",
              sets: 3,
              rest: 180,
              warmupHtml: `
                <span class="warmup-step">1️⃣ <b>1x8-10 (40% objetivo):</b> Activación articular/vascular. Descanso: 45s.</span>
                <span class="warmup-step">2️⃣ <b>1x4-5 (65% objetivo):</b> Aproximación de carga y tempo. Descanso: 60s.</span>
                <span class="warmup-step">3️⃣ <b>1x2 (85% objetivo):</b> Activación neurológica/potenciación sin fatiga. Descanso: 120s antes de S1.</span>
                <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> 3 series x 8-10 reps (RIR 1-2). Agarre thumbless, codos a 45-60° (proteger tendón codo).</div>`
            },
            {
              id: "bench_free_barbell",
              name: "Press banca con barra libre",
              targetReps: "6-8",
              sets: 3,
              rest: 180,
              warmupHtml: `
                <span class="warmup-step">1️⃣ <b>1x8 solo barra:</b> Patrón motor y arco torácico neutro.</span>
                <span class="warmup-step">2️⃣ <b>1x4 (60% objetivo):</b> Activación de leg drive.</span>
                <span class="warmup-step">3️⃣ <b>1x2 (80% objetivo):</b> Activación neurológica.</span>
                <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> 3 series x 6-8 reps (RIR 1-2). Trayectoria diagonal a esternón bajo. Codos sin abrir en cruz.</div>`
            },
            {
              id: "bench_flat_db",
              name: "Press plano con mancuernas",
              targetReps: "8-10",
              sets: 3,
              rest: 180,
              warmupHtml: `
                <span class="warmup-step">1️⃣ <b>1x8 ligera:</b> Enfoque en rango de descenso y apertura.</span>
                <span class="warmup-step">2️⃣ <b>1x3 (70% objetivo):</b> Calibración de agarre semi-neutro.</span>
                <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> 3 series x 8-10 reps (RIR 1). Agarre a 45° para proteger inserción del tríceps/codo izquierdo.</div>`
            }
          ]
        },
        {
          slotId: "push_slot_military",
          slotName: "Press Hombro",
          defaultVariant: "military_smith",
          variants: [
            {
              id: "military_smith",
              name: "Press militar en guiada",
              targetReps: "8-10",
              sets: 3,
              rest: 180,
              warmupHtml: `
                <span class="warmup-step">1️⃣ <b>1x5 (50% objetivo):</b> Tanteo del patrón motor y banco (75-80°). Descanso: 60s.</span>
                <span class="warmup-step">2️⃣ <b>1x2 (80% objetivo):</b> Activación neurológica del deltoides anterior. Descanso: 90s antes de S1.</span>
                <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> 3 series x 8-10 reps (RIR 1-2). Cero hiperextensión lumbar; mantener glúteos y abdomen firmes.</div>`
            },
            {
              id: "military_db_seated",
              name: "Press de hombros con mancuernas sentado",
              targetReps: "8-10",
              sets: 3,
              rest: 180,
              warmupHtml: `
                <span class="warmup-step">1️⃣ <b>1x6 moderada:</b> Ajuste del respaldo y arranque controlado.</span>
                <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> 3 series x 8-10 reps (RIR 1). Agarre ligeramente diagonal; descenso hasta nivel de orejas.</div>`
            }
          ]
        },
        {
          slotId: "push_slot_katana",
          slotName: "Tríceps Cabeza Larga",
          defaultVariant: "katana_cable",
          variants: [
            {
              id: "katana_cable",
              name: "Extensiones Katana en polea",
              targetReps: "10-12",
              sets: 3,
              rest: 90,
              warmupHtml: `
                <span class="warmup-step">1️⃣ <b>1x10 muy ligera:</b> Lubricación de la bursa y tendón tríceps izquierdo. Descanso: 45s antes de S1.</span>
                <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> 3 series x 10-12 reps (RIR 1). Estiramiento profundo de la cabeza larga; sin rebotes en flexión máxima.</div>`
            }
          ]
        },
        {
          slotId: "push_slot_cable_fly",
          slotName: "Aislamiento Pectoral",
          defaultVariant: "cable_fly",
          variants: [
            {
              id: "cable_fly",
              name: "Cruces en polea",
              targetReps: "12-15",
              sets: 3,
              rest: 90,
              warmupHtml: `
                <span class="warmup-step">1️⃣ <b>1x6 moderada:</b> Ajuste del punto de anclaje y sensación esternal. Descanso: 45s antes de S1.</span>
                <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> 3 series x 12-15 reps (RIR 0-1). Microflexión de codo constante; énfasis en contracción pico (1s).</div>`
            },
            {
              id: "pec_deck_fly",
              name: "Contractor de pecho / Pec Deck",
              targetReps: "12-15",
              sets: 3,
              rest: 90,
              warmupHtml: `<div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> 3 series x 12-15 reps. Altura del asiento al esternón medio; contracción de 1s.</div>`
            }
          ]
        },
        {
          slotId: "push_slot_lateral_raise",
          slotName: "Deltoides Lateral",
          defaultVariant: "lat_raise_incline",
          variants: [
            {
              id: "lat_raise_incline",
              name: "Elevaciones laterales en banco inclinado",
              targetReps: "12-15",
              sets: 3,
              rest: 90,
              warmupHtml: `
                <span class="warmup-step">1️⃣ <b>1x8 ligera:</b> Enfoque del deltoides lateral sin balanceo. Descanso: 45s antes de S1.</span>
                <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> 3 series x 12-15 reps (RIR 0-1). Apoyo torácico completo para eliminar inercia lumbar.</div>`
            },
            {
              id: "lat_raise_cable_single",
              name: "Elevaciones laterales en polea unilateral",
              targetReps: "12-15",
              sets: 3,
              rest: 60,
              warmupHtml: `<div class="warmup-target">🎯 <b>Efectivas (60s desc):</b> 3 series x 12-15 reps. Polea a la altura del muslo; tensión continua.</div>`
            }
          ]
        },
        {
          slotId: "push_slot_pushdown",
          slotName: "Tríceps Cabezas Lateral/Medial",
          defaultVariant: "triceps_pushdown",
          variants: [
            {
              id: "triceps_pushdown",
              name: "Extensiones tríceps en polea",
              targetReps: "10-12",
              sets: 3,
              rest: 90,
              warmupHtml: `
                <span class="warmup-step">1️⃣ <b>1x8 moderada:</b> Activación de cabezas lateral/medial. Descanso: 45s antes de S1.</span>
                <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> 3 series x 10-12 reps (RIR 0-1). Codos estables y muñecas neutras (cero torsión).</div>`
            }
          ]
        }
      ],

      pull: [
        {
          slotId: "pull_slot_vertical",
          slotName: "Tracción Vertical Pesada",
          defaultVariant: "pullup_weighted",
          variants: [
            {
              id: "pullup_weighted",
              name: "Dominadas lastradas",
              targetReps: "8",
              sets: 3,
              rest: 180,
              warmupHtml: `
                <span class="warmup-step">1️⃣ <b>Colgado pasivo 15 s + movilidad escapular.</b></span>
                <span class="warmup-step">2️⃣ <b>4 reps con peso corporal.</b></span>
                <span class="warmup-step">3️⃣ <b>1 rep con +5 kg.</b></span>
                <div class="warmup-target">🎯 <b>Efectivas (2.5-3m desc):</b> 3 series x 8 reps con PC + 5 kg. Barbilla superando la barra; bajada frenada en 2-3 s. Cero balanceo. Consolidar 3x8 antes de subir a +6.25 kg.</div>`
            },
            {
              id: "lat_pulldown_cable",
              name: "Jalón al pecho en polea (agarre neutro o prono)",
              targetReps: "8-10",
              sets: 3,
              rest: 180,
              warmupHtml: `
                <span class="warmup-step">1️⃣ <b>1x6 moderada:</b> Fijación de rodillos.</span>
                <span class="warmup-step">2️⃣ <b>1x2 (75% objetivo):</b> Retracción escapular inicial.</span>
                <div class="warmup-target">🎯 <b>Efectivas (2.5-3m desc):</b> 3 series x 8-10 reps (RIR 1-2). Tronco ligeramente retrasado (~15°); tracción al esternón superior sin arquear lumbares.</div>`
            }
          ]
        },
        {
          slotId: "pull_slot_tbar",
          slotName: "Remo Pesado Dorsal",
          defaultVariant: "tbar_support",
          variants: [
            {
              id: "tbar_support",
              name: "Remo en T con soporte",
              targetReps: "8 (+ back-off)",
              sets: 3,
              rest: 180,
              warmupHtml: `

        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {}
    }

    /* SISTEMA DE TEMPORIZADOR */
    function setTimerDirect(seconds) {
      clearInterval(timerInterval);
      hasAlertedOvertime = false;
      const targetTime = Date.now() + (seconds * 1000);
      localStorage.setItem('TIMER_TARGET_MS', targetTime.toString());

      const banner = document.getElementById('timer-banner');
      banner.classList.remove('overtime');
      banner.style.display = 'flex';
      
      tickTimer();
      timerInterval = setInterval(tickTimer, 500);
    }

    function startTimer(seconds) {
      setTimerDirect(seconds);
    }

    function tickTimer() {
      const storedTarget = localStorage.getItem('TIMER_TARGET_MS');
      if (!storedTarget) {
        clearInterval(timerInterval);
        document.getElementById('timer-banner').style.display = 'none';
        document.title = "PPL Minimal Tracker";
        return;
      }

      const diffMs = parseInt(storedTarget, 10) - Date.now();
      const diffSec = Math.floor(diffMs / 1000);
      const banner = document.getElementById('timer-banner');

      if (diffSec < 0) {
        banner.classList.add('overtime');
        if (!hasAlertedOvertime) {
          playBeep();
          if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
          hasAlertedOvertime = true;
        }
        renderTimerDisplay(diffSec, true);
      } else {
        banner.classList.remove('overtime');
        renderTimerDisplay(diffSec, false);
      }
    }

    function addTimerTime(sec) {
      const storedTarget = localStorage.getItem('TIMER_TARGET_MS');
      const base = storedTarget ? Math.max(parseInt(storedTarget, 10), Date.now()) : Date.now();
      const newTarget = base + (sec * 1000);
      localStorage.setItem('TIMER_TARGET_MS', newTarget.toString());
      
      hasAlertedOvertime = false;
      document.getElementById('timer-banner').style.display = 'flex';
      clearInterval(timerInterval);
      tickTimer();
      timerInterval = setInterval(tickTimer, 500);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      localStorage.removeItem('TIMER_TARGET_MS');
      const banner = document.getElementById('timer-banner');
      banner.classList.remove('overtime');
      banner.style.display = 'none';
      document.title = "PPL Minimal Tracker";
    }

    function renderTimerDisplay(totalSeconds, isNegative) {
      const absSec = Math.abs(totalSeconds);
      const min = Math.floor(absSec / 60);
      const sec = absSec % 60;
      const prefix = isNegative ? "-" : "";
      const formatted = `${prefix}${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      
      document.getElementById('timer-display').innerText = formatted;
      document.title = `(${formatted}) PPL Tracker`;
    }

    function checkActiveTimerOnLoad() {
      const storedTarget = localStorage.getItem('TIMER_TARGET_MS');
      if (storedTarget) {
        document.getElementById('timer-banner').style.display = 'flex';
        tickTimer();
        clearInterval(timerInterval);
        timerInterval = setInterval(tickTimer, 500);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        checkActiveTimerOnLoad();
      }
    });

    /* CAPA DE PERSISTENCIA POR ID CON MIGRACIÓN SILENCIOSA DE DATOS ANTIGUOS */
    function getHistoricalExerciseData(exId, exName) {
      const db = JSON.parse(localStorage.getItem('EXERCISE_HISTORY_DB') || '{}');
      if (db[exId] && db[exId].length > 0) {
        return db[exId];
      }

      // Si no existe por ID, se busca en las sesiones previas antiguas por nombre para migrarlo
      const routinesList = ['push', 'pull', 'legs', 'repaso', 'dia5'];
      for (const rType of routinesList) {
        const oldSession = JSON.parse(localStorage.getItem(`LAST_SESSION_${rType}`) || '{}');
        // Búsqueda insensible a mayúsculas/espacios
        const foundKey = Object.keys(oldSession).find(k => k.trim().toLowerCase() === exName.trim().toLowerCase());
        if (foundKey && oldSession[foundKey] && oldSession[foundKey].length > 0) {
          db[exId] = oldSession[foundKey];
          localStorage.setItem('EXERCISE_HISTORY_DB', JSON.stringify(db));
          return db[exId];
        }
      }

      return null;
    }

    function saveExerciseDataToDB(exId, setsArray) {
      const db = JSON.parse(localStorage.getItem('EXERCISE_HISTORY_DB') || '{}');
      db[exId] = setsArray;
      localStorage.setItem('EXERCISE_HISTORY_DB', JSON.stringify(db));
    }

    /* AUTO-GUARDADO DE BORRADOR POR ID */
    function saveDraft() {
      let draft = {};
      const slots = routineSlots[currentRoutine];
      slots.forEach((slot) => {
        const activeVarId = localStorage.getItem(`ACTIVE_VARIANT_${slot.slotId}`) || slot.defaultVariant;
        const ex = slot.variants.find(v => v.id === activeVarId) || slot.variants[0];
        draft[ex.id] = {};
        for (let s = 1; s <= ex.sets; s++) {
          const kg = document.getElementById(`kg_${slot.slotId}_${s}`)?.value || '';
          const reps = document.getElementById(`reps_${slot.slotId}_${s}`)?.value || '';
          const rir = document.getElementById(`rir_${slot.slotId}_${s}`)?.value || '';
          if (kg || reps || rir) {
            draft[ex.id][s] = { kg, reps, rir };
          }
        }
      });
      localStorage.setItem(`DRAFT_V2_${currentRoutine}`, JSON.stringify(draft));
    }

    function clearDraft() {
      localStorage.removeItem(`DRAFT_V2_${currentRoutine}`);
      localStorage.removeItem(`DRAFT_${currentRoutine}`);
    }

    function onVariantChanged(slotId, newVariantId) {
      localStorage.setItem(`ACTIVE_VARIANT_${slotId}`, newVariantId);
      loadRoutine(currentRoutine);
    }

    /* RENDERIZADO DINÁMICO DE RUTINAS */
    function loadRoutine(type) {
      currentRoutine = type;
      const selector = document.getElementById('routine-selector');
      if (selector && selector.value !== type) {
        selector.value = type;
      }

      const container = document.getElementById('exercise-list');
      container.innerHTML = '';
      document.getElementById('response-box').style.display = 'none';

      const rawTextHistory = localStorage.getItem(`LAST_TEXT_${type}`);
      const historyContentEl = document.getElementById('history-content');
      if (rawTextHistory) {
        historyContentEl.innerText = rawTextHistory;
      } else {
        historyContentEl.innerText = "No hay registros previos guardados para este día.";
      }

      const draftV2 = JSON.parse(localStorage.getItem(`DRAFT_V2_${type}`) || '{}');
      const slots = routineSlots[type];

      slots.forEach((slot) => {
        const activeVarId = localStorage.getItem(`ACTIVE_VARIANT_${slot.slotId}`) || slot.defaultVariant;
        const ex = slot.variants.find(v => v.id === activeVarId) || slot.variants[0];

        // Obtener historial por ID (con fallback a nombre si es antiguo)
        const prevSets = getHistoricalExerciseData(ex.id, ex.name) || [];

        let setsHtml = '';
        let previousSetsSummary = [];

        for (let s = 1; s <= ex.sets; s++) {
          const label = (ex.name.includes("Gemelos") && s <= 2) ? `S${s}E` : `S${s}`;
          const prevSet = prevSets[s - 1];
          const lastKg = prevSet?.kg || 'kg';
          const lastReps = prevSet?.reps || ex.targetReps || 'reps';
          const lastRir = prevSet?.rir !== undefined && prevSet?.rir !== '' ? `RIR ${prevSet.rir}` : 'rir';

          const currentKg = draftV2[ex.id]?.[s]?.kg ?? '';
          const currentReps = draftV2[ex.id]?.[s]?.reps ?? '';
          const currentRir = draftV2[ex.id]?.[s]?.rir ?? '';

          if (prevSet?.kg && prevSet?.reps) {
            previousSetsSummary.push(`${label}: ${prevSet.kg}kg x ${prevSet.reps} (RIR ${prevSet.rir ?? '-'})`);
          }

          setsHtml += `
            <div class="set-row">
              <span class="set-label">${label}</span>
              <input type="number" step="0.25" placeholder="${lastKg}" value="${currentKg}" id="kg_${slot.slotId}_${s}" oninput="saveDraft()">
              <input type="number" placeholder="${lastReps}" value="${currentReps}" id="reps_${slot.slotId}_${s}" oninput="saveDraft()">
              <input type="number" placeholder="${lastRir}" value="${currentRir}" id="rir_${slot.slotId}_${s}" oninput="saveDraft()">
              <button class="btn-timer-trigger" onclick="startTimer(${ex.rest})" title="Iniciar descanso">⏱️</button>
            </div>`;
        }

        const restLabel = ex.rest >= 120 ? `${ex.rest / 60}m` : `${ex.rest}s`;
        
        const prevBannerHtml = previousSetsSummary.length > 0 
          ? `<div class="prev-performance-banner">⏮️ <b>Anterior:</b> ${previousSetsSummary.join(' | ')}</div>` 
          : '';

        // Construir selector de variantes si el slot tiene más de 1 opción
        let variantSelectHtml = '';
        if (slot.variants.length > 1) {
          const optionsHtml = slot.variants.map(v => 
            `<option value="${v.id}" ${v.id === ex.id ? 'selected' : ''}>${v.name}</option>`
          ).join('');

          variantSelectHtml = `
            <div class="variant-selector-wrap">
              <span>🔄 Máquina / Variante:</span>
              <select class="variant-select" onchange="onVariantChanged('${slot.slotId}', this.value)">
                ${optionsHtml}
              </select>
            </div>`;
        }

        container.innerHTML += `
          <details class="exercise-card">
            <summary>
              <div class="exercise-title-wrap">
                <span class="exercise-arrow">▶</span>
                <span class="exercise-title">${ex.name}</span>
                <span class="exercise-reps-badge">${ex.targetReps} reps</span>
              </div>
              <span class="rest-badge">${restLabel}</span>
            </summary>
            <div class="exercise-body">
              ${variantSelectHtml}
              ${prevBannerHtml}
              <details class="warmup-details">
                <summary>Calentamiento / Objetivos / Claves</summary>
                <div class="warmup-content">${ex.warmupHtml}</div>
              </details>
              <div class="set-header">
                <span></span>
                <span>KG</span>
                <span>REPS</span>
                <span>RIR</span>
                <span>TIMER</span>
              </div>
              ${setsHtml}
            </div>
          </details>`;
      });
    }

    /* RESTAURACIÓN RÁPIDA DE DÍA 2: PULL */

        "Remo en T con soporte": [{kg: "45", reps: "8", rir: "2"}, {kg: "45", reps: "8", rir: "2"}, {kg: "35", reps: "8", rir: "1"}],
        "Rear Delt polea unilateral": [{kg: "7.5", reps: "15", rir: "1"}, {kg: "7.5", reps: "14", rir: "1"}, {kg: "7.5", reps: "12", rir: "0"}],

      saveExerciseDataToDB("row_multipower", marcasPull["Remo en multipower"]);
      saveExerciseDataToDB("curl_preacher_ez", marcasPull["Curl predicador barra Z"]);

    /* ACTUALIZACIÓN FORZADA EN MÓVIL SIN TOCAR LOCALSTORAGE */
    function forzarActualizacion() {
      if ('caches' in window) {
        caches.keys().then(names => {
          names.forEach(name => caches.delete(name));
        });
      }
      window.location.href = window.location.pathname + '?v=' + Date.now();
    }

    function getWorkoutSummary() {
      const now = new Date();
      const dateStr = `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}`;
      let summary = `Entrenamiento realizado (${currentRoutine.toUpperCase()}) - ${dateStr}:\n`;
      let sessionData = {};
      let hasData = false;

      const slots = routineSlots[currentRoutine];

      slots.forEach((slot) => {
        const activeVarId = localStorage.getItem(`ACTIVE_VARIANT_${slot.slotId}`) || slot.defaultVariant;
        const ex = slot.variants.find(v => v.id === activeVarId) || slot.variants[0];

        let setsData = [];
        let exerciseSets = [];

        for (let s = 1; s <= ex.sets; s++) {
          const kg = document.getElementById(`kg_${slot.slotId}_${s}`)?.value;
          const reps = document.getElementById(`reps_${slot.slotId}_${s}`)?.value;
          const rir = document.getElementById(`rir_${slot.slotId}_${s}`)?.value;

          if (kg && reps) {
            hasData = true;
            setsData.push(`Serie ${s}: ${kg} kg x ${reps} reps (RIR ${rir !== "" ? rir : "N/A"})`);
            exerciseSets.push({ kg, reps, rir });
          }
        }
        if (setsData.length > 0) {
          summary += `\n* ${ex.name} [Diana: ${ex.targetReps} reps]:\n  - ${setsData.join('\n  - ')}\n`;
          sessionData[ex.name] = exerciseSets;
          // Guardar por ID inmutable
          saveExerciseDataToDB(ex.id, exerciseSets);
        }
      });

      return { summary, sessionData, hasData };
    }

    function copyWorkoutToClipboard() {
      const { summary, sessionData, hasData } = getWorkoutSummary();
      if (!hasData) {
        alert("Introduce al menos una serie antes de copiar.");
        return;
      }
      
      localStorage.setItem(`LAST_SESSION_${currentRoutine}`, JSON.stringify(sessionData));
      localStorage.setItem(`LAST_TEXT_${currentRoutine}`, summary);
      clearDraft();
      
      navigator.clipboard.writeText(summary).then(() => {
        alert("¡Copiado y guardado en el historial! Listo para pegar en el chat.");
        document.getElementById('history-content').innerText = summary;
      }).catch(err => {
        alert("Error al copiar: " + err);
      });
    }

    function configureApiKey() {
      const current = localStorage.getItem('GEMINI_API_KEY') || '';
      const key = prompt("Pega tu Google AI Studio API Key:", current);
      if (key !== null) localStorage.setItem('GEMINI_API_KEY', key.trim());
    }

    async function submitWorkout() {
      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) {
        alert("Configura tu API Key usando el botón 'API Key'.");
        configureApiKey();
        return;
      }

      const { summary, sessionData, hasData } = getWorkoutSummary();
      if (!hasData) {
        alert("Introduce al menos una serie con peso y repeticiones.");
        return;
      }

      const previousSession = localStorage.getItem(`LAST_TEXT_${currentRoutine}`) || "Primera sesión registrada con esta app.";
      const btn = document.getElementById('btn-submit');
      const resBox = document.getElementById('response-box');
      btn.innerText = "Analizando...";
      document.body.classList.add('loading');

      try {
        const userPrompt = `SESIÓN ANTERIOR DE REFERENCIA:
${previousSession}

SESIÓN DE HOY:
${summary}

Por favor:
1. Compara rendimiento respecto a la sesión anterior (sobrecarga progresiva lograda o mantenida).
2. Evalúa series con fallo técnico, descansos o fatiga articular (codo izquierdo y lumbar).
3. Establece las cargas diana y repeticiones para la siguiente sesión de forma concisa usando una tabla Markdown clara con columnas: Ejercicio, Series, Carga Diana, Reps Objetivo, Descanso, Clave de Ejecución y RIR.`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
            contents: [{ parts: [{ text: userPrompt }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          resBox.style.background = "#450a0a";
          resBox.style.border = "1px solid #dc2626";
          resBox.innerText = `Error de API (${data.error.code}): ${data.error.message}`;
        } else {
          localStorage.setItem(`LAST_SESSION_${currentRoutine}`, JSON.stringify(sessionData));
          localStorage.setItem(`LAST_TEXT_${currentRoutine}`, summary);
          clearDraft();
          document.getElementById('history-content').innerText = summary;

          resBox.style.background = "#022c22";
          resBox.style.border = "1px solid #059669";
          resBox.innerText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No se recibió respuesta.";
        }
        resBox.style.display = 'block';
        resBox.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        resBox.style.background = "#450a0a";
        resBox.style.border = "1px solid #dc2626";
        resBox.innerText = "Error de conexión: " + err.message;
        resBox.style.display = 'block';
      } finally {
        btn.innerText = "Enviar Gemini";
        document.body.classList.remove('loading');
      }
    }

    loadRoutine('push');
    checkActiveTimerOnLoad();
  </script>
