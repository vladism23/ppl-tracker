<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>PPL Minimal Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 16px; padding-bottom: 80px; }
    h1 { font-size: 1.25rem; text-align: center; margin-bottom: 16px; color: #38bdf8; letter-spacing: 0.05em; }
    
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #2563eb; color: #fff; border-color: #3b82f6; }

    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .exercise-title { font-size: 1rem; font-weight: 600; color: #f1f5f9; margin-bottom: 10px; }
    
    .set-row { display: grid; grid-template-columns: 35px 1fr 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
    .set-label { font-size: 0.85rem; color: #94a3b8; font-weight: bold; text-align: center; }
    input { background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; padding: 8px; text-align: center; font-size: 1rem; }
    input:focus { border-color: #38bdf8; outline: none; }

    .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid #334155; padding: 12px 16px; display: flex; gap: 8px; }
    .btn-send { flex: 2; background: #10b981; color: #042f2e; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; padding: 12px; cursor: pointer; }
    .btn-config { flex: 1; background: #334155; color: #f8fafc; border: none; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }

    #response-box { display: none; background: #022c22; border: 1px solid #059669; border-radius: 12px; padding: 14px; margin-top: 16px; font-size: 0.9rem; line-height: 1.5; color: #ecfdf5; white-space: pre-wrap; }
    .loading { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>

  <h1>PPL TRACKER</h1>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="loadRoutine('push')">Push</button>
    <button class="tab-btn" onclick="loadRoutine('pull')">Pull</button>
    <button class="tab-btn" onclick="loadRoutine('legs')">Legs</button>
  </div>

  <div id="exercise-list"></div>

  <div id="response-box"></div>

  <div class="footer-bar">
    <button class="btn-config" onclick="configureApiKey()">API Key</button>
    <button class="btn-send" id="btn-submit" onclick="submitWorkout()">ENVIAR A GEMINI</button>
  </div>

  <script>
    const routines = {
      push: [
        "Press banca en guiada",
        "Press militar en guiada",
        "Extensiones Katana en polea",
        "Cruces en polea",
        "Elevaciones laterales en banco",
        "Extensiones tríceps en polea"
      ],
      pull: [
        "Dominadas lastradas",
        "Remo en T con soporte",
        "Rear delt polea unilateral",
        "Remo en multipower",
        "Curl predicador barra Z",
        "Curl Bayesian en polea"
      ],
      legs: [
        "Sentadilla en guiada",
        "Peso muerto rumano en guiada",
        "Extensión de cuádriceps",
        "Curl femoral en máquina",
        "Máquina de aductores",
        "Gemelos sentado en guiada"
      ]
    };

    let currentRoutine = 'push';

    function loadRoutine(type) {
      currentRoutine = type;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const container = document.getElementById('exercise-list');
      container.innerHTML = '';
      document.getElementById('response-box').style.display = 'none';

      routines[type].forEach((name, exIdx) => {
        const numSets = (name.includes("Gemelos")) ? 4 : 3;
        let setsHtml = '';
        for (let s = 1; s <= numSets; s++) {
          setsHtml += `
            <div class="set-row">
              <span class="set-label">S${s}</span>
              <input type="number" step="0.25" placeholder="kg" id="kg_${exIdx}_${s}">
              <input type="number" placeholder="reps" id="reps_${exIdx}_${s}">
              <input type="number" placeholder="rir" id="rir_${exIdx}_${s}">
            </div>`;
        }

        container.innerHTML += `
          <div class="card">
            <div class="exercise-title">${name}</div>
            <div class="set-row" style="margin-bottom:4px;">
              <span></span>
              <span class="set-label">KG</span>
              <span class="set-label">REPS</span>
              <span class="set-label">RIR</span>
            </div>
            ${setsHtml}
          </div>`;
      });
    }

    function configureApiKey() {
      const current = localStorage.getItem('GEMINI_API_KEY') || '';
      const key = prompt("Pega tu Google AI Studio API Key:", current);
      if (key !== null) {
        localStorage.setItem('GEMINI_API_KEY', key.trim());
      }
    }

    async function submitWorkout() {
      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) {
        alert("Configura primero tu API Key gratuita de Google AI Studio.");
        configureApiKey();
        return;
      }

      let workoutSummary = `Entrenamiento de hoy (${currentRoutine.toUpperCase()}):\n`;
      let hasData = false;

      routines[currentRoutine].forEach((name, exIdx) => {
        const numSets = (name.includes("Gemelos")) ? 4 : 3;
        let setsData = [];
        for (let s = 1; s <= numSets; s++) {
          const kg = document.getElementById(`kg_${exIdx}_${s}`).value;
          const reps = document.getElementById(`reps_${exIdx}_${s}`).value;
          const rir = document.getElementById(`rir_${exIdx}_${s}`).value;
          if (kg && reps) {
            hasData = true;
            setsData.push(`S${s}: ${kg}kg x ${reps} reps (RIR ${rir || 'N/A'})`);
          }
        }
        if (setsData.length > 0) {
          workoutSummary += `- ${name}: ${setsData.join(', ')}\n`;
        }
      });

      if (!hasData) {
        alert("Rellena al menos un ejercicio antes de enviar.");
        return;
      }

      const btn = document.getElementById('btn-submit');
      const resBox = document.getElementById('response-box');
      btn.innerText = "Analizando...";
      document.body.classList.add('loading');

      try {
        const promptText = `Actúa como mi entrenador de hipertrofia. Este es mi entrenamiento de hoy:\n\n${workoutSummary}\n\nAnaliza el rendimiento serie por serie, valida la sobrecarga progresiva y dame los objetivos exactos de kilos y repeticiones para la próxima sesión de este mismo día de forma concisa.`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Error al procesar la respuesta.";
        
        resBox.innerText = reply;
        resBox.style.display = 'block';
        resBox.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        alert("Error de conexión: " + err.message);
      } finally {
        btn.innerText = "ENVIAR A GEMINI";
        document.body.classList.remove('loading');
      }
    }

    // Inicializar con Push
    loadRoutine('push');
  </script>
</body>
</html>
