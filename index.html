<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>PPL Minimal Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 12px; padding-bottom: 95px; }

    /* Barra superior del cronómetro */
    #timer-banner {
      display: none;
      position: sticky;
      top: 0;
      z-index: 200;
      background: #0284c7;
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.55);
      flex-direction: column;
      gap: 8px;
      transition: background-color 0.3s ease;
    }
    #timer-banner.overtime {
      background: #dc2626 !important;
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.5);
    }

    .timer-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    #timer-display { 
      font-size: 3.6rem; 
      font-weight: 900; 
      font-variant-numeric: tabular-nums; 
      letter-spacing: 0.02em;
      line-height: 0.95;
    }

    /* Botones rápidos de descanso */
    .timer-presets {
      display: flex;
      gap: 5px;
      width: 100%;
    }
    .preset-btn {
      flex: 1;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      padding: 7px 0;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }
    .preset-btn:active { background: rgba(255,255,255,0.4); }

    .timer-controls { display: flex; gap: 6px; align-items: center; }
    .timer-btn {
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.5);
      color: #fff;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
    }
    .timer-btn:active { background: rgba(255,255,255,0.45); }

    /* Elementos ocultos para el stream PiP */
    #pip-canvas, #pip-video {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 320px;
      height: 180px;
      opacity: 0;
      pointer-events: none;
    }

    /* Menú Desplegable de Rutinas */
    .nav-select-wrapper { margin-bottom: 10px; }
    .nav-select {
      width: 100%;
      padding: 12px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      text-align-last: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .nav-select:focus { border-color: #38bdf8; outline: none; }

    /* Panel de Historial de Sesión Anterior */
    .history-card {
      background: #111e38;
      border: 1px solid #1e3a8a;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.82rem;
    }
    .history-card summary {
      color: #60a5fa;
      font-weight: 700;
      cursor: pointer;
      list-style: none;
      outline: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-card summary::-webkit-details-marker { display: none; }
    .history-card summary:before { content: "📋 Ver Historial Sesión Anterior ▾"; }
    .history-card[open] summary:before { content: "📋 Ocultar Historial ▴"; }
    .history-body {
      margin-top: 8px;
      color: #cbd5e1;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.78rem;
      background: #0b1329;
      padding: 8px;
      border-radius: 6px;
      max-height: 200px;
      overflow-y: auto;
    }

    /* Tarjetas colapsables de ejercicios */
    details.exercise-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    details.exercise-card summary {
      padding: 14px 12px;
      cursor: pointer;
      list-style: none;
      outline: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    details.exercise-card summary::-webkit-details-marker { display: none; }
    
    .exercise-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .exercise-arrow {
      color: #38bdf8;
      font-size: 0.8rem;
      transition: transform 0.2s ease;
    }
    details.exercise-card[open] .exercise-arrow {
      transform: rotate(90deg);
    }
    .exercise-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: #f1f5f9;
    }
    .rest-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: #38bdf8;
      background: #082f49;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .exercise-body {
      padding: 0 12px 12px 12px;
      border-top: 1px solid #283548;
      padding-top: 10px;
    }

    /* Línea de referencia del entreno anterior en cada tarjeta */
    .prev-performance-banner {
      font-size: 0.75rem;
      color: #93c5fd;
      background: rgba(30, 58, 138, 0.35);
      border-left: 3px solid #3b82f6;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    /* Calentamiento colapsable */
    details.warmup-details { 
      margin-bottom: 10px; 
      font-size: 0.78rem; 
      background: #0b132b; 
      border-radius: 8px; 
      padding: 8px 10px; 
      border: 1px solid #1e3a5f; 
    }
    details.warmup-details summary { cursor: pointer; color: #f59e0b; font-weight: 700; list-style: none; outline: none; }
    details.warmup-details summary::-webkit-details-marker { display: none; }
    details.warmup-details summary:before { content: "▸ "; color: #f59e0b; }
    details.warmup-details[open] summary:before { content: "▾ "; }
    .warmup-content { margin-top: 8px; color: #cbd5e1; line-height: 1.5; }
    .warmup-step { margin-bottom: 4px; display: block; }
    .warmup-step b { color: #38bdf8; }
    .warmup-target { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #334155; color: #a5f3fc; }

    /* Filas de series */
    .set-header { display: grid; grid-template-columns: 34px 1fr 1fr 1fr 40px; gap: 6px; margin-bottom: 4px; }
    .set-header span { font-size: 0.7rem; color: #64748b; font-weight: 700; text-align: center; }
    .set-row { display: grid; grid-template-columns: 34px 1fr 1fr 1fr 40px; gap: 6px; align-items: center; margin-bottom: 7px; }
    .set-label { font-size: 0.75rem; color: #94a3b8; font-weight: 700; text-align: center; }

    input { background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; padding: 7px 2px; text-align: center; font-size: 0.95rem; width: 100%; -moz-appearance: textfield; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input:focus { border-color: #38bdf8; outline: none; }

    .btn-timer-trigger { background: #334155; border: 1px solid #475569; color: #e2e8f0; border-radius: 6px; padding: 6px 0; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-timer-trigger:active { background: #0284c7; }

    /* Barra inferior fija */
    .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid #334155; padding: 10px 14px; display: flex; gap: 8px; z-index: 100; }
    .btn-action { border: none; border-radius: 8px; font-weight: 700; font-size: 0.85rem; padding: 11px; cursor: pointer; }
    .btn-cfg { flex: 1; background: #334155; color: #f8fafc; }
    .btn-copy { flex: 1.2; background: #475569; color: #f8fafc; }
    .btn-send { flex: 2; background: #10b981; color: #042f2e; }

    #response-box { display: none; border-radius: 10px; padding: 14px; margin-top: 16px; font-size: 0.88rem; line-height: 1.5; white-space: pre-wrap; }
    .loading { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>

  <!-- Elementos de Canvas y Video para Picture-in-Picture -->
  <canvas id="pip-canvas" width="320" height="180"></canvas>
  <video id="pip-video" muted playsinline autoplay></video>

  <!-- Cronómetro Flotante -->
  <div id="timer-banner">
    <div class="timer-top-row">
      <span id="timer-display">00:00</span>
      <div class="timer-controls">
        <button class="timer-btn" onclick="togglePiP()" title="Ventana flotante sobre otras apps">⧉ PiP</button>
        <button class="timer-btn" onclick="addTimerTime(30)">+30s</button>
        <button class="timer-btn" onclick="stopTimer()">✕</button>
      </div>
    </div>
    <div class="timer-presets">
      <button class="preset-btn" onclick="setTimerDirect(45)">45s</button>
      <button class="preset-btn" onclick="setTimerDirect(60)">60s</button>
      <button class="preset-btn" onclick="setTimerDirect(90)">90s</button>
      <button class="preset-btn" onclick="setTimerDirect(120)">2m</button>
      <button class="preset-btn" onclick="setTimerDirect(180)">3m</button>
    </div>
  </div>

  <!-- Selector Desplegable de Rutinas -->
  <div class="nav-select-wrapper">
    <select class="nav-select" id="routine-selector" onchange="loadRoutine(this.value)">
      <option value="push">Día 1: Push (Empuje)</option>
      <option value="pull">Día 2: Pull (Tirón)</option>
      <option value="legs">Día 3: Legs (Pierna)</option>
      <option value="repaso">Día 4: Repaso (Pecho / Espalda)</option>
      <option value="dia5">Día 5: (Pendiente de definir)</option>
    </select>
  </div>

  <!-- Bloque de Historial General de la Sesión Previa -->
  <details class="history-card" id="history-panel">
    <summary></summary>
    <div class="history-body" id="history-content">No hay registros de sesiones anteriores para esta rutina.</div>
  </details>

  <!-- Lista de Ejercicios -->
  <div id="exercise-list"></div>

  <div id="response-box"></div>

  <div class="footer-bar">
    <button class="btn-action btn-cfg" onclick="configureApiKey()">API Key</button>
    <button class="btn-action btn-copy" onclick="copyWorkoutToClipboard()">Copiar</button>
    <button class="btn-action btn-send" id="btn-submit" onclick="submitWorkout()">Enviar Gemini</button>
  </div>

  <script>
    const SYSTEM_INSTRUCTION = `Eres el entrenador personal del usuario, experto en hipertrofia basada en evidencia, sobrecarga progresiva y salud articular.
Pautas ortopédicas permanentes:
- Codo izquierdo: Cuidar inserción del tendón del tríceps. Katana extensions en vez de presses franceses.
- Zona lumbar: Cero compresión axial innecesaria. Pies 15-20 cm adelantados y agarre thumbless en sentadilla guiada; peso muerto rumano en guiada con straps.
- Gemelos (Sóleo): 2 series pesadas en estiramiento (parada 2 s abajo) + 2 series en rango completo.
Evalúa sobrecarga progresiva estricta respecto a la sesión previa.`;

    const routines = {
      push: [
        {
          name: "Press banca en guiada",
          sets: 3,
          rest: 180,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8-10 (40% objetivo):</b> Activación articular/vascular. Descanso: 45s.</span>
            <span class="warmup-step">2️⃣ <b>1x4-5 (65% objetivo):</b> Aproximación de carga y tempo. Descanso: 60s.</span>
            <span class="warmup-step">3️⃣ <b>1x2 (85% objetivo):</b> Activación neurológica/potenciación sin fatiga. Descanso: 120s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> RIR 1-2. Agarre thumbless, codos a 45-60° (proteger tendón codo).</div>`
        },
        {
          name: "Press militar en guiada",
          sets: 3,
          rest: 180,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x5 (50% objetivo):</b> Tanteo del patrón motor y banco (75-80°). Descanso: 60s.</span>
            <span class="warmup-step">2️⃣ <b>1x2 (80% objetivo):</b> Activación neurológica del deltoides anterior. Descanso: 90s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> RIR 1-2. Cero hiperextensión lumbar; mantener glúteos y abdomen firmes.</div>`
        },
        {
          name: "Extensiones Katana en polea",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x10 muy ligera:</b> Lubricación de la bursa y tendón tríceps izquierdo. Descanso: 45s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> RIR 1. Estiramiento profundo de la cabeza larga; sin rebotes en flexión máxima.</div>`
        },
        {
          name: "Cruces en polea",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x6 moderada:</b> Ajuste del punto de anclaje y sensación esternal. Descanso: 45s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> RIR 0-1. Microflexión de codo constante; énfasis en contracción pico (1s).</div>`
        },
        {
          name: "Elevaciones laterales en banco inclinado",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8 ligera:</b> Enfoque del deltoides lateral sin balanceo. Descanso: 45s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> RIR 0-1. Apoyo torácico completo para eliminar inercia lumbar.</div>`
        },
        {
          name: "Extensiones tríceps en polea",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8 moderada:</b> Activación de cabezas lateral/medial. Descanso: 45s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> RIR 0-1. Codos estables y muñecas neutras (cero torsión).</div>`
        }
      ],
      pull: [
        {
          name: "Dominadas lastradas",
          sets: 3,
          rest: 180,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x5 solo peso corporal:</b> Descompresión escapular y vascularización. Descanso: 60s.</span>
            <span class="warmup-step">2️⃣ <b>1x2 con 50% del lastre previsto:</b> Activación neurológica y agarre. Descanso: 120s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> RIR 1-2. Depresión escapular estricta antes de flexionar codos.</div>`
        },
        {
          name: "Remo en T con soporte",
          sets: 3,
          rest: 180,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x6 (50% objetivo):</b> Ajuste del cojín esternal (cero carga en lumbares). Descanso: 60s.</span>
            <span class="warmup-step">2️⃣ <b>1x2 (80% objetivo):</b> Calibración de retracción y straps. Descanso: 90s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> RIR 1. Máxima tracción dorsal sin despegar el pecho del apoyo.</div>`
        },
        {
          name: "Rear delt polea unilateral",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8 ligera:</b> Orientar el brazo en el plano escapular (45°). Descanso: 45s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> RIR 0-1. Cero retracción trapecial; aislamiento deltoides posterior.</div>`
        },
        {
          name: "Remo en multipower",
          sets: 3,
          rest: 180,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x5 moderada con straps:</b> Fijación de bisagra cadera. Descanso: 90s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> RIR 1-2. Tracción dirigida a la cadera/ombligo con espalda neutra.</div>`
        },
        {
          name: "Curl predicador barra Z",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8 ligera:</b> Aclimatación bicipital en el banco Scott. Descanso: 45s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> RIR 1. Frenar la bajada antes del bloqueo para proteger tendón bicipital.</div>`
        },
        {
          name: "Curl Bayesian en polea",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x6 ligera:</b> Posicionar el paso adelantado y tensión de estiramiento. Descanso: 45s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> RIR 0-1. Hombro en ligera extensión; tensión continua.</div>`
        }
      ],
      legs: [
        {
          name: "Sentadilla en guiada",
          sets: 3,
          rest: 180,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8 solo barra:</b> Movilidad de tobillo y posicionamiento adelantado (15-20 cm). Descanso: 60s.</span>
            <span class="warmup-step">2️⃣ <b>1x4 (50% objetivo):</b> Aproximación de profundidad y apoyo plantar. Descanso: 90s.</span>
            <span class="warmup-step">3️⃣ <b>1x2 (80% objetivo):</b> Activación neuronal y brace abdominal. Descanso: 120s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> RIR 1-2. Agarre thumbless, cero compresión cervical/lumbar.</div>`
        },
        {
          name: "Peso muerto rumano en guiada",
          sets: 3,
          rest: 180,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x6 (50% objetivo) con straps:</b> Fijación del patrón de bisagra de cadera. Descanso: 90s.</span>
            <span class="warmup-step">2️⃣ <b>1x2 (80% objetivo):</b> Tanteo del rango de elongación de isquios. Descanso: 120s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> RIR 1-2. No descender más allá de la pérdida de neutralidad lumbar.</div>`
        },
        {
          name: "Gemelos guiada (S1-S2 Estir / S3-S4 Full)",
          sets: 4,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x10 ligera:</b> Despertar tendón de Aquiles y flexión dorsal. Descanso: 45s antes de S1.</span>
            <div class="warmup-target">🎯 <b>S1 y S2 (90s desc):</b> Pausa estricta de 2 segundos en máximo estiramiento (Sóleo).<br>🎯 <b>S3 y S4 (90s desc):</b> Rango completo cadenciado a altas repeticiones.</div>`
        },
        {
          name: "Curl femoral en máquina",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8 moderada:</b> Ajuste del rodillo y anclaje pélvico. Descanso: 45s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> RIR 1. Flexión de rodilla explosiva y excéntrica controlada (3s).</div>`
        },
        {
          name: "Extensión de cuádriceps",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8 ligera:</b> Lubricación de la rótula. Descanso: 45s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> RIR 0-1. 1s de contracción isométrica en extensión total.</div>`
        },
        {
          name: "Máquina de aductores",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8 ligera:</b> Movilidad de la articulación coxofemoral. Descanso: 45s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> RIR 1. Rango amplio y sin rebotes en máxima apertura.</div>`
        }
      ],
      repaso: [
        {
          name: "Pullover en polea alta con cuerda",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8 ligera:</b> Enfoque en extensión dorsal y anclaje de codos. Descanso: 45s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> RIR 1-2. Codos fijos en microflexión constante (cero estrés en tríceps).</div>`
        },
        {
          name: "Press inclinado 30° mancuernas",
          sets: 3,
          rest: 180,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8 (40% objetivo):</b> Activación haz clavicular y estabilidad. Descanso: 60s.</span>
            <span class="warmup-step">2️⃣ <b>1x3 (70% objetivo):</b> Aproximación de agarre a 45°. Descanso: 90s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> RIR 1-2. Banco a 30° estricto; agarre semi-neutro seguro para el codo.</div>`
        },
        {
          name: "Trap Bar Shrugs (Barra hexagonal)",
          sets: 3,
          rest: 180,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x6 barra sola con straps:</b> Ajuste de inclinación de torso (20° adelante). Descanso: 60s.</span>
            <span class="warmup-step">2️⃣ <b>1x2 (75% objetivo):</b> Activación de trapecio superior/medio. Descanso: 90s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (3m desc):</b> RIR 1. Pausa de 2s en contracción alta; columna lumbar 100% protegida.</div>`
        },
        {
          name: "Cruces polea alta (Pecho inferior)",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x6 moderada:</b> Ajuste de trayectoria hacia el ombligo. Descanso: 45s antes de S1.</span>
            <div class="warmup-target">🎯 <b>Efectivas (90s desc):</b> RIR 0-1. Contracción isométrica de 1 segundo al cruzar muñecas.</div>`
        }
      ],
      dia5: [
        {
          name: "Ejercicio 1 (Por definir)",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8 aproximación:</b> Pendiente de definir pautas de carga.</span>
            <div class="warmup-target">🎯 <b>Efectivas:</b> Pendiente de acordar con el usuario.</div>`
        },
        {
          name: "Ejercicio 2 (Por definir)",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8 aproximación:</b> Pendiente de definir pautas de carga.</span>
            <div class="warmup-target">🎯 <b>Efectivas:</b> Pendiente de acordar con el usuario.</div>`
        },
        {
          name: "Ejercicio 3 (Por definir)",
          sets: 3,
          rest: 90,
          warmupHtml: `
            <span class="warmup-step">1️⃣ <b>1x8 aproximación:</b> Pendiente de definir pautas de carga.</span>
            <div class="warmup-target">🎯 <b>Efectivas:</b> Pendiente de acordar con el usuario.</div>`
        }
      ]
    };

    let currentRoutine = 'push';
    let timerInterval = null;
    let hasAlertedOvertime = false;
    let pipStream = null;

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {}
    }

    /* RENDERIZADO EN CANVAS PARA PICTURE-IN-PICTURE */
    function updatePiPCanvas(timeText, isOvertime) {
      const canvas = document.getElementById('pip-canvas');
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      ctx.fillStyle = isOvertime ? '#dc2626' : '#0284c7';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.font = 'bold 20px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(isOvertime ? 'EXCESO DESCANSO' : 'DESCANSO PPL', canvas.width / 2, 40);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 78px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(timeText, canvas.width / 2, 105);
    }

    /* GESTIÓN DE VENTANA FLOTANTE (PiP) */
    async function togglePiP() {
      const video = document.getElementById('pip-video');
      const canvas = document.getElementById('pip-canvas');

      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
          return;
        }

        if (!pipStream) {
          pipStream = canvas.captureStream(30);
          video.srcObject = pipStream;
        }

        await video.play();

        if (video.requestPictureInPicture) {
          await video.requestPictureInPicture();
        } else if (video.webkitSetPresentationMode) {
          video.webkitSetPresentationMode('picture-in-picture');
        } else {
          alert("Tu navegador no soporta Picture-in-Picture nativo.");
        }
      } catch (err) {
        console.error("Error al iniciar PiP:", err);
      }
    }

    /* TEMPORIZADOR BASE */
    function setTimerDirect(seconds) {
      clearInterval(timerInterval);
      hasAlertedOvertime = false;
      const targetTime = Date.now() + (seconds * 1000);
      localStorage.setItem('TIMER_TARGET_MS', targetTime.toString());

      const banner = document.getElementById('timer-banner');
      banner.classList.remove('overtime');
      banner.style.display = 'flex';
      
      tickTimer();
      timerInterval = setInterval(tickTimer, 500);
    }

    function startTimer(seconds) {
      setTimerDirect(seconds);
    }

    function tickTimer() {
      const storedTarget = localStorage.getItem('TIMER_TARGET_MS');
      if (!storedTarget) {
        clearInterval(timerInterval);
        document.getElementById('timer-banner').style.display = 'none';
        return;
      }

      const diffMs = parseInt(storedTarget, 10) - Date.now();
      const diffSec = Math.floor(diffMs / 1000);
      const banner = document.getElementById('timer-banner');

      if (diffSec < 0) {
        banner.classList.add('overtime');
        if (!hasAlertedOvertime) {
          playBeep();
          if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
          hasAlertedOvertime = true;
        }
        renderTimerDisplay(diffSec, true);
      } else {
        banner.classList.remove('overtime');
        renderTimerDisplay(diffSec, false);
      }
    }

    function addTimerTime(sec) {
      const storedTarget = localStorage.getItem('TIMER_TARGET_MS');
      const base = storedTarget ? Math.max(parseInt(storedTarget, 10), Date.now()) : Date.now();
      const newTarget = base + (sec * 1000);
      localStorage.setItem('TIMER_TARGET_MS', newTarget.toString());
      
      hasAlertedOvertime = false;
      document.getElementById('timer-banner').style.display = 'flex';
      clearInterval(timerInterval);
      tickTimer();
      timerInterval = setInterval(tickTimer, 500);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      localStorage.removeItem('TIMER_TARGET_MS');
      const banner = document.getElementById('timer-banner');
      banner.classList.remove('overtime');
      banner.style.display = 'none';

      if (document.pictureInPictureElement) {
        document.exitPictureInPicture().catch(() => {});
      }
    }

    function renderTimerDisplay(totalSeconds, isNegative) {
      const absSec = Math.abs(totalSeconds);
      const min = Math.floor(absSec / 60);
      const sec = absSec % 60;
      const prefix = isNegative ? "-" : "";
      const formatted = `${prefix}${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      
      document.getElementById('timer-display').innerText = formatted;
      updatePiPCanvas(formatted, isNegative);
    }

    function checkActiveTimerOnLoad() {
      const storedTarget = localStorage.getItem('TIMER_TARGET_MS');
      if (storedTarget) {
        document.getElementById('timer-banner').style.display = 'flex';
        tickTimer();
        clearInterval(timerInterval);
        timerInterval = setInterval(tickTimer, 500);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        checkActiveTimerOnLoad();
      }
    });

    function loadRoutine(type) {
      currentRoutine = type;
      const selector = document.getElementById('routine-selector');
      if (selector && selector.value !== type) {
        selector.value = type;
      }

      const container = document.getElementById('exercise-list');
      container.innerHTML = '';
      document.getElementById('response-box').style.display = 'none';

      const rawTextHistory = localStorage.getItem(`LAST_TEXT_${type}`);
      const historyContentEl = document.getElementById('history-content');
      if (rawTextHistory) {
        historyContentEl.innerText = rawTextHistory;
      } else {
        historyContentEl.innerText = "No hay registros previos guardados para este día.";
      }

      const history = JSON.parse(localStorage.getItem(`LAST_SESSION_${type}`) || '{}');

      routines[type].forEach((ex, exIdx) => {
        let setsHtml = '';
        let previousSetsSummary = [];

        for (let s = 1; s <= ex.sets; s++) {
          const label = (ex.name.includes("Gemelos") && s <= 2) ? `S${s}E` : `S${s}`;
          const prevSet = history[ex.name]?.[s - 1];
          const lastKg = prevSet?.kg || 'kg';
          const lastReps = prevSet?.reps || 'reps';
          const lastRir = prevSet?.rir !== undefined && prevSet?.rir !== '' ? `RIR ${prevSet.rir}` : 'rir';

          if (prevSet?.kg && prevSet?.reps) {
            previousSetsSummary.push(`${label}: ${prevSet.kg}kg x ${prevSet.reps} (RIR ${prevSet.rir ?? '-'})`);
          }

          setsHtml += `
            <div class="set-row">
              <span class="set-label">${label}</span>
              <input type="number" step="0.25" placeholder="${lastKg}" id="kg_${exIdx}_${s}">
              <input type="number" placeholder="${lastReps}" id="reps_${exIdx}_${s}">
              <input type="number" placeholder="${lastRir}" id="rir_${exIdx}_${s}">
              <button class="btn-timer-trigger" onclick="startTimer(${ex.rest})" title="Iniciar descanso">⏱️</button>
            </div>`;
        }

        const restLabel = ex.rest >= 120 ? `${ex.rest / 60}m` : `${ex.rest}s`;
        const prevBannerHtml = previousSetsSummary.length > 0 
          ? `<div class="prev-performance-banner">⏮️ <b>Anterior:</b> ${previousSetsSummary.join(' | ')}</div>` 
          : `<div class="prev-performance-banner" style="opacity: 0.6;">⏮️ Sin registros anteriores</div>`;

        // Tarjeta con elemento details: cerrada por defecto (sin atributo open)
        container.innerHTML += `
          <details class="exercise-card">
            <summary>
              <div class="exercise-title-wrap">
                <span class="exercise-arrow">▶</span>
                <span class="exercise-title">${ex.name}</span>
              </div>
              <span class="rest-badge">${restLabel}</span>
            </summary>
            <div class="exercise-body">
              ${prevBannerHtml}
              <details class="warmup-details">
                <summary>Calentamiento / Objetivos / Claves</summary>
                <div class="warmup-content">${ex.warmupHtml}</div>
              </details>
              <div class="set-header">
                <span></span>
                <span>KG</span>
                <span>REPS</span>
                <span>RIR</span>
                <span>TIMER</span>
              </div>
              ${setsHtml}
            </div>
          </details>`;
      });
    }

    function getWorkoutSummary() {
      const now = new Date();
      const dateStr = `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}`;
      let summary = `Entrenamiento realizado (${currentRoutine.toUpperCase()}) - ${dateStr}:\n`;
      let sessionData = {};
      let hasData = false;

      routines[currentRoutine].forEach((ex, exIdx) => {
        let setsData = [];
        sessionData[ex.name] = [];

        for (let s = 1; s <= ex.sets; s++) {
          const kg = document.getElementById(`kg_${exIdx}_${s}`)?.value;
          const reps = document.getElementById(`reps_${exIdx}_${s}`)?.value;
          const rir = document.getElementById(`rir_${exIdx}_${s}`)?.value;

          if (kg && reps) {
            hasData = true;
            setsData.push(`Serie ${s}: ${kg} kg x ${reps} reps (RIR ${rir !== "" ? rir : "N/A"})`);
            sessionData[ex.name].push({ kg, reps, rir });
          }
        }
        if (setsData.length > 0) {
          summary += `\n* ${ex.name}:\n  - ${setsData.join('\n  - ')}\n`;
        }
      });

      return { summary, sessionData, hasData };
    }

    function copyWorkoutToClipboard() {
      const { summary, sessionData, hasData } = getWorkoutSummary();
      if (!hasData) {
        alert("Introduce al menos una serie antes de copiar.");
        return;
      }
      
      localStorage.setItem(`LAST_SESSION_${currentRoutine}`, JSON.stringify(sessionData));
      localStorage.setItem(`LAST_TEXT_${currentRoutine}`, summary);
      
      navigator.clipboard.writeText(summary).then(() => {
        alert("¡Copiado y guardado en el historial! Listo para pegar en el chat.");
        document.getElementById('history-content').innerText = summary;
      }).catch(err => {
        alert("Error al copiar: " + err);
      });
    }

    function configureApiKey() {
      const current = localStorage.getItem('GEMINI_API_KEY') || '';
      const key = prompt("Pega tu Google AI Studio API Key:", current);
      if (key !== null) localStorage.setItem('GEMINI_API_KEY', key.trim());
    }

    async function submitWorkout() {
      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) {
        alert("Configura tu API Key usando el botón 'API Key'.");
        configureApiKey();
        return;
      }

      const { summary, sessionData, hasData } = getWorkoutSummary();
      if (!hasData) {
        alert("Introduce al menos una serie con peso y repeticiones.");
        return;
      }

      const previousSession = localStorage.getItem(`LAST_TEXT_${currentRoutine}`) || "Primera sesión registrada con esta app.";
      const btn = document.getElementById('btn-submit');
      const resBox = document.getElementById('response-box');
      btn.innerText = "Analizando...";
      document.body.classList.add('loading');

      try {
        const userPrompt = `SESIÓN ANTERIOR DE REFERENCIA:
${previousSession}

SESIÓN DE HOY:
${summary}

Por favor:
1. Compara rendimiento respecto a la sesión anterior (sobrecarga progresiva lograda o mantenida).
2. Evalúa series con fallo técnico, descansos o fatiga articular (codo izquierdo y lumbar).
3. Establece las cargas diana y repeticiones para la siguiente sesión de forma concisa.`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
            contents: [{ parts: [{ text: userPrompt }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          resBox.style.background = "#450a0a";
          resBox.style.border = "1px solid #dc2626";
          resBox.innerText = `Error de API (${data.error.code}): ${data.error.message}`;
        } else {
          localStorage.setItem(`LAST_SESSION_${currentRoutine}`, JSON.stringify(sessionData));
          localStorage.setItem(`LAST_TEXT_${currentRoutine}`, summary);
          document.getElementById('history-content').innerText = summary;

          resBox.style.background = "#022c22";
          resBox.style.border = "1px solid #059669";
          resBox.innerText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No se recibió respuesta.";
        }
        resBox.style.display = 'block';
        resBox.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        resBox.style.background = "#450a0a";
        resBox.style.border = "1px solid #dc2626";
        resBox.innerText = "Error de conexión: " + err.message;
        resBox.style.display = 'block';
      } finally {
        btn.innerText = "Enviar Gemini";
        document.body.classList.remove('loading');
      }
    }

    loadRoutine('push');
    checkActiveTimerOnLoad();
  </script>
